name: complyfood-staging

# Local staging: production image targets (compiled builds, no hot reload),
# but fully self-contained on your machine with its own Postgres + MinIO.
# Isolated ports/volumes so it can run alongside the dev stack.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: complyfood
      POSTGRES_USER: complyfood
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-complyfood_staging}
    ports:
      - '5433:5432'
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U complyfood']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '9002:9000'
      - '9003:9001'
    volumes:
      - staging_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Creates the bucket once MinIO is up, then exits.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-complyfood} &&
      echo 'Bucket ready.'
      "

  # One-shot: runs TypeORM migrations, then exits. Uses the dev image target
  # because migrations need ts-node + the .ts data-source/entities, which the
  # slim production image does not include.
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: dev
    environment:
      DATABASE_URL: postgres://complyfood:${POSTGRES_PASSWORD:-complyfood_staging}@postgres:5432/complyfood
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/apps/api
    command: ['npx', 'typeorm-ts-node-commonjs', 'migration:run', '-d', 'src/database/data-source.ts']
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: production
    environment:
      DATABASE_URL: postgres://complyfood:${POSTGRES_PASSWORD:-complyfood_staging}@postgres:5432/complyfood
      JWT_SECRET: ${JWT_SECRET:-staging-secret-change-me}
      PASSWORD_RESET_TOKEN_SALT: ${PASSWORD_RESET_TOKEN_SALT:-staging-salt-change-me}
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      WEB_URL: http://localhost:3100
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-complyfood}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '4100:4000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      target: production
      args:
        # NEXT_PUBLIC_* is inlined at build time, so the browser-facing API URL
        # must be baked in here. The browser reaches the API on the host port.
        NEXT_PUBLIC_API_URL: http://localhost:4100
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4100
    ports:
      - '3100:3000'
    depends_on:
      - api
    restart: unless-stopped

  # Optional demo data. Only runs when you pass --seed (profile "seed").
  seed:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: dev
    profiles: ['seed']
    environment:
      DATABASE_URL: postgres://complyfood:${POSTGRES_PASSWORD:-complyfood_staging}@postgres:5432/complyfood
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    working_dir: /app/apps/api
    command: ['npx', 'ts-node', 'src/database/seeds/dev.seed.ts']
    restart: 'no'

volumes:
  staging_postgres_data:
  staging_minio_data:
